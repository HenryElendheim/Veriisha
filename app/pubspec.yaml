name: veriisha_app
description: "Veriisha - the game, as an application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # The engine is a separate pure-Dart package, so it still runs and tests
  # headless. The app just depends on it and draws the interface.
  veriisha:
    path: ../
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
