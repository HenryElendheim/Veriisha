include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # The engine must stay deterministic. Unseeded randomness and wall-clock
    # reads would break run replay, so treat their accidental use as a warning.
    unused_import: warning

linter:
  rules:
    - prefer_final_locals
    - prefer_const_constructors
    - avoid_print # bin/ harness opts out locally; library code never prints
